<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>空气净化器控制 · Web 蓝牙</title>
<link href="style.css" rel="stylesheet" />
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand">
      <span class="dot" id="dot"></span>
      <h1>空气净化器控制</h1>
      <span class="sub" id="devName">未连接</span>
    </div>
    <button class="btn-conn ghost" id="switchBtn" style="display:none">换设备</button>
    <button class="btn-conn" id="connBtn">连接蓝牙</button>
  </header>

  <main>
    <section class="panel">
      <div class="pwr">
        <span>电源</span>
        <button class="switch" id="pwrBtn" aria-pressed="true"><i></i><b>开</b></button>
      </div>

      <div class="gauges">
        <div class="lvl"><span id="bigLvl">1</span><em>档</em></div>
        <div class="right">
          <div class="pct"><span id="pct">33</span><small>%</small></div>
          <div class="bar"><div class="fill" id="fill"></div></div>
        </div>
      </div>

      <div class="btns">
        <button data-lv="1" class="active">低 档</button>
        <button data-lv="2">中 档</button>
        <button data-lv="3">高 档</button>
      </div>
    </section>

    <aside class="side">
      <h2>通信日志</h2>
      <div class="log" id="log"></div>
      <div class="hint" id="hint"></div>
    </aside>
  </main>
</div>

<!-- ================= 设备选择弹窗 ================= -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet">
    <div class="sheet-head">
      <div>
        <h3 id="modalTitle">选择蓝牙设备</h3>
        <p>选一个设备连接。连接过的设备会记住，下次直接点即可。</p>
      </div>
      <button class="icon-btn" id="closeBtn" title="关闭">✕</button>
    </div>

    <div class="dev-list" id="devList"></div>

    <div class="sheet-foot">     
      <button class="scan" id="scanBtn">扫描新设备</button>
      <!-- <div class="note" id="modalNote"> -->
        <!-- 浏览器出于隐私不允许网页自行枚举附近设备，点上方按钮会弹出系统扫描列表（可多选其一）。 -->
      <!-- </div> -->
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="control.js"></script>
</body>
</html>
